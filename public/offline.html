<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f2e8" />
    <title>おかしな探検隊 — オフライン</title>
    <style>
      body {
        margin: 0;
        background: #f6f2e8;
        color: #30493d;
        font-family: system-ui, sans-serif;
        text-align: center;
        display: grid;
        min-height: 100dvh;
        place-items: center;
      }
      main {
        padding: 28px;
        max-width: 420px;
      }
      h1 {
        font-size: 24px;
      }
      p {
        line-height: 2;
        font-size: 15px;
      }
      .icon {
        font-size: 64px;
      }
      a {
        display: inline-block;
        background: #3e654d;
        color: #fffdf7;
        padding: 16px 24px;
        border-radius: 14px;
        text-decoration: none;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">🏡</div>
      <h1>いまは、ひとやすみ。</h1>
      <p>
        インターネットにつながっていないみたい。<br />つながったら、またあそびにきてね。<br />ほぞんずみのおもいでは、おうちでまっているよ。
      </p>
      <a href="/">もういちどひらく</a>
    </main>
  </body>
</html>
